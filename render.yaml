services:
  - type: web
    name: accesovivo-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --workspace=@control-accesos/api
    startCommand: npm run start -w @control-accesos/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SOCKET
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
